<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>現場巡檢系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      margin: 0; padding: 12px; background: #f0f2f5; color: #222;
    }
    .card {
      background: #fff; padding: 18px; border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px;
    }
    h3 { margin: 0 0 4px; font-size: 20px; }
    .sub { color: #777; font-size: 13px; margin-bottom: 12px; }
    label { font-weight: 600; display: block; margin: 14px 0 6px; font-size: 15px; }
    input, select, textarea {
      width: 100%; padding: 11px; border: 1px solid #d0d0d0; border-radius: 8px;
      font-size: 16px; background: #fff; color: #222;
    }
    select { appearance: none; }
    textarea { resize: vertical; }
    .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
    .item-name { flex: 1; font-size: 15px; font-weight: 500; }
    .item-status { flex: 1.2; }
    .item-status select { font-size: 14px; padding: 9px; }
    .status-OK   { border-color: #2e9e5b; }
    .status-MILD { border-color: #e0a800; }
    .status-BAD  { border-color: #d63a3a; }
    .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photo-thumb { width: 82px; height: 82px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .photo-add {
      width: 82px; height: 82px; border: 2px dashed #bbb; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #888; font-size: 30px; cursor: pointer; background: #fafafa;
    }
    button.submit {
      width: 100%; padding: 15px; background: #00B900; color: #fff; border: none;
      border-radius: 10px; font-size: 18px; font-weight: 700; margin: 6px 0 10px;
      box-shadow: 0 3px 8px rgba(0,185,0,0.25);
    }
    button.submit:disabled { background: #9ac79a; }
    #statusBar { text-align: center; font-size: 14px; color: #666; min-height: 20px; margin-bottom: 8px; }
    .hint { font-size: 13px; color: #a33; background: #fff3f3; padding: 8px; border-radius: 6px; margin-top: 10px; display: none; }
    .userbox { font-size: 14px; color: #444; background: #f6f8fa; border-radius: 8px; padding: 10px; }
    .userbox b { color: #111; }
  </style>
</head>
<body>

  <div class="card">
    <h3>現場巡檢與品質稽核</h3>
    <div class="sub">提交後自動寫入後台試算表</div>
    <div class="userbox">
      督導：<b id="userName">載入中…</b>
      <br><span id="userLine" style="font-size:12px;color:#999;"></span>
    </div>

    <label>巡檢案場</label>
    <select id="site"></select>

    <label>巡檢項目</label>
    <div id="itemsBox"></div>

    <label>現場照片（可多張，直接拍照）</label>
    <div class="photo-grid" id="photoGrid"></div>
    <div class="photo-add" id="photoAdd" onclick="document.getElementById('fileInput').click()">＋</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" multiple style="display:none">

    <label>缺失說明與指示</label>
    <textarea id="note" rows="3" placeholder="如有缺失，請詳細說明需要改進的地方…"></textarea>

    <div id="statusBar"></div>
    <button class="submit" id="submitBtn" onclick="submitForm()">確認提交巡檢紀錄</button>
    <div class="hint" id="hint"></div>
  </div>

<script>
/* =========================================================
   設定區（只需修改這一段）
   ========================================================= */
var CONFIG = {
  // ★★★ 填入你申請到的 LIFF ID（見上線指南步驟 2）★★★
  liffId: "2012065234-tqTtFxjn",

  // ★★★ 填入你部署好的 Google Apps Script 網址（見指南步驟 1）★★★
  gasUrl: "https://script.google.com/macros/s/AKfycby9f-JRQTyaq26_4U8F6AsJ5n6OFxEDBZLuVaLvGSIm15I4qL-xmdYzIFNGU96dZcMp/exec",

  // ★★★ 案場清單：在這裡增減選項即可 ★★★
  sites: ["帝王京都", "山盟海誓", "岩美璞丰", "瑞昇全家福", "其他案場"],

  // ★★★ 巡檢項目：在這裡增減項目 ★★★
  items: [
    { name: "大廳與公設衛生", statuses: ["合格", "輕微缺失", "嚴重缺失"] },
    { name: "電梯運作",       statuses: ["合格", "輕微缺失", "嚴重缺失"] },
    { name: "消防設備",       statuses: ["合格", "輕微缺失", "嚴重缺失"] },
    { name: "逃生通道",       statuses: ["合格", "輕微缺失", "嚴重缺失"] },
    { name: "停車場與周邊",   statuses: ["合格", "輕微缺失", "嚴重缺失"] },
    { name: "門禁與保全點",   statuses: ["合格", "輕微缺失", "嚴重缺失"] }
  ]
};

/* =========================================================
   以下為程式主體，非工程師請勿修改
   ========================================================= */
var photos = [];   // 已選照片（壓縮後的 base64）

/* ---- 建立案場與巡檢項目介面 ---- */
(function buildForm(){
  var siteSel = document.getElementById('site');
  CONFIG.sites.forEach(function(s){
    var o = document.createElement('option'); o.value = s; o.textContent = s; siteSel.appendChild(o);
  });
  var box = document.getElementById('itemsBox');
  CONFIG.items.forEach(function(it, idx){
    var row = document.createElement('div'); row.className = 'item-row';
    var name = document.createElement('div'); name.className = 'item-name'; name.textContent = (idx+1) + '. ' + it.name;
    var wrap = document.createElement('div'); wrap.className = 'item-status';
    var sel = document.createElement('select'); sel.id = 'item_' + idx; sel.dataset.name = it.name;
    it.statuses.forEach(function(st){
      var o = document.createElement('option'); o.value = st; o.textContent = st; sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ sel.className = sel.value === '合格' ? 'status-OK' : (sel.value === '輕微缺失' ? 'status-MILD' : 'status-BAD'); });
    wrap.appendChild(sel);
    row.appendChild(name); row.appendChild(wrap);
    box.appendChild(row);
  });
})();

/* ---- LIFF 初始化：自動抓取 LINE 暱稱與 ID ---- */
function initLIFF(){
  var status = document.getElementById('statusBar');
  if (typeof liff === 'undefined') { status.textContent = 'LIFF SDK 載入失敗'; return; }
  liff.init({ liffId: CONFIG.liffId })
    .then(function(){
      if (!liff.isLoggedIn()) {
        liff.login();   // 第一次使用會自動要求授權
        return;
      }
      return liff.getProfile().then(function(profile){
        document.getElementById('userName').textContent = profile.displayName;
        document.getElementById('userLine').textContent = 'LINE ID：' + profile.userId;
        status.textContent = '';
      });
    })
    .catch(function(err){
      document.getElementById('hint').style.display = 'block';
      document.getElementById('hint').textContent = '無法初始化 LINE：' + err + '（請確認已設定 LIFF ID）';
      status.textContent = '初始化失敗';
    });
}
initLIFF();

/* ---- 照片選擇與前端壓縮（避免檔案太大） ---- */
document.getElementById('fileInput').addEventListener('change', function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  files.forEach(compressAndAdd);
  this.value = '';
});

function compressAndAdd(file){
  if (photos.length >= 6) { alert('最多 6 張照片'); return; }
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = 1280;
      var scale = img.width > maxW ? maxW / img.width : 1;
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
      photos.push({ name: file.name, data: base64 });
      renderPhotos();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderPhotos(){
  var grid = document.getElementById('photoGrid');
  grid.innerHTML = '';
  photos.forEach(function(p, i){
    var img = document.createElement('img');
    img.className = 'photo-thumb';
    img.src = 'data:image/jpeg;base64,' + p.data;
    img.onclick = function(){ if(confirm('刪除這張照片？')) { photos.splice(i,1); renderPhotos(); } };
    grid.appendChild(img);
  });
}

/* ---- 送出表單 ---- */
function submitForm(){
  if (!CONFIG.liffId || CONFIG.liffId === 'YOUR_LIFF_ID_HERE') {
    document.getElementById('hint').style.display = 'block';
    document.getElementById('hint').textContent = '請先在上線指南中完成 LIFF ID 設定。';
    return;
  }
  if (typeof liff === 'undefined' || !liff.isLoggedIn()) {
    alert('尚未完成 LINE 身分認證，請重新點開此連結。');
    return;
  }

  var items = [];
  CONFIG.items.forEach(function(it, idx){
    var sel = document.getElementById('item_' + idx);
    items.push({ name: it.name, status: sel.value });
  });

  var payload = {
    userName: document.getElementById('userName').textContent,
    lineId: liff.getDecodedIDToken() ? liff.getDecodedIDToken().sub : '',
    site: document.getElementById('site').value,
    items: items,
    note: document.getElementById('note').value,
    photos: photos
  };

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('statusBar').textContent = '提交中，請稍候…';

  fetch(CONFIG.gasUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(){
    document.getElementById('statusBar').textContent = '提交成功！';
    alert('巡檢紀錄已送出，感謝您！');
    try { if (liff.isInClient()) liff.closeWindow(); } catch(e){}
  }).catch(function(err){
    document.getElementById('statusBar').textContent = '提交失敗，請重試';
    alert('提交失敗：' + err);
    btn.disabled = false;
  });
}
</script>
</body>
</html>
