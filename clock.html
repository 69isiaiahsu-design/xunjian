<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>上下班打卡</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; margin: 0; padding: 12px; background: #f0f2f5; color: #222; }
    .card { background: #fff; padding: 18px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h3 { margin: 0 0 4px; font-size: 20px; }
    .sub { color: #777; font-size: 13px; margin-bottom: 12px; }
    label { font-weight: 600; display: block; margin: 14px 0 6px; font-size: 15px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 16px; background: #fff; color: #222; }
    select { appearance: none; }
    .userbox { font-size: 14px; color: #444; background: #f6f8fa; border-radius: 8px; padding: 10px; }
    .userbox b { color: #111; }
    .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photo-thumb { width: 82px; height: 82px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .photo-add { width: 82px; height: 82px; border: 2px dashed #bbb; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 30px; cursor: pointer; background: #fafafa; }
    .clock-row { display: flex; gap: 10px; margin-top: 6px; }
    button.clock { flex: 1; padding: 14px; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
    button.clock:disabled { opacity: .55; }
    #clockStatus { text-align: center; font-size: 14px; color: #666; min-height: 20px; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h3>上下班打卡</h3>
    <div class="sub">打卡會自動記錄時間，可選填照片，並自動帶入手機位置</div>
    <div class="userbox">
      打卡人員：<b id="clockName">載入中…</b>
      <br><span id="clockLine" style="font-size:12px;color:#999;"></span>
    </div>

    <label>打卡案場</label>
    <select id="clockSite"></select>

    <label>打卡照片（選填，可拍照）</label>
    <div class="photo-grid" id="clockPhotoGrid"></div>
    <div class="photo-add" onclick="document.getElementById('clockFileInput').click()">＋</div>
    <input type="file" id="clockFileInput" accept="image/*" capture="environment" style="display:none">

    <div id="clockStatus"></div>
    <div class="clock-row">
      <button class="clock" id="clockInBtn" style="background:#00B900;" onclick="doClock('上班')">上班打卡</button>
      <button class="clock" id="clockOutBtn" style="background:#E8742C;" onclick="doClock('下班')">下班打卡</button>
    </div>
  </div>

<script>
/* =========================================================
   設定區（只需修改這一段）
   ========================================================= */
var CONFIG = {
  // ★★★ 填入「上下班打卡」這個 LIFF 的 ID（見分頁設定步驟）★★★
  liffId: "YOUR_CLOCK_LIFF_ID",

  // ★★★ 後端網址（含打卡功能）★★★
  gasUrl: "https://script.google.com/macros/s/AKfycbyRBU18jNte4x-tjdOMM6kjSDuQZq_n6L0FN1evt4xCjuXBGw3K97hgVFSpzNeA9i1n/exec",

  // ★★★ 案場清單：在這裡增減選項即可 ★★★
  sites: ["帝王京都", "山盟海誓", "岩美璞丰", "瑞昇全家福", "其他案場"]
};

/* =========================================================
   以下為程式主體，非工程師請勿修改
   ========================================================= */
var clockPhotos = [];

function buildClockSite(){
  var sel = document.getElementById('clockSite');
  sel.innerHTML = '';
  CONFIG.sites.forEach(function(s){
    var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o);
  });
}

function getLocation(){
  return new Promise(function(resolve){
    if (!navigator.geolocation) return resolve('');
    navigator.geolocation.getCurrentPosition(
      function(pos){
        var lat = pos.coords.latitude.toFixed(6);
        var lng = pos.coords.longitude.toFixed(6);
        resolve(lat + ',' + lng + ' https://www.google.com/maps?q=' + lat + ',' + lng);
      },
      function(){ resolve(''); },
      { timeout: 8000, enableHighAccuracy: false }
    );
  });
}

function doClock(type){
  var btn = type === '上班' ? document.getElementById('clockInBtn') : document.getElementById('clockOutBtn');
  btn.disabled = true;
  document.getElementById('clockStatus').textContent = '打卡中…';
  getLocation().then(function(loc){
    var payload = {
      action: 'clock',
      userName: document.getElementById('clockName').textContent,
      lineId: liff.getDecodedIDToken() ? liff.getDecodedIDToken().sub : '',
      site: document.getElementById('clockSite').value,
      clockType: type,
      location: loc,
      photos: clockPhotos
    };
    return fetch(CONFIG.gasUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }).then(function(){
    document.getElementById('clockStatus').textContent = '打卡成功！';
    alert(type + '打卡成功！');
    clockPhotos = [];
    renderClockPhotos();
    try { if (liff.isInClient()) liff.closeWindow(); } catch(e){}
  }).catch(function(err){
    document.getElementById('clockStatus').textContent = '打卡失敗，請重試';
    alert('打卡失敗：' + err);
    btn.disabled = false;
  });
}

document.getElementById('clockFileInput').addEventListener('change', function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  files.forEach(function(f){
    if (clockPhotos.length >= 3) { alert('最多 3 張照片'); return; }
    compressImage(f, function(base64){ clockPhotos.push({ name: f.name, data: base64 }); renderClockPhotos(); });
  });
  this.value = '';
});

function renderClockPhotos(){
  var grid = document.getElementById('clockPhotoGrid');
  grid.innerHTML = '';
  clockPhotos.forEach(function(p, i){
    var img = document.createElement('img');
    img.className = 'photo-thumb';
    img.src = 'data:image/jpeg;base64,' + p.data;
    img.onclick = function(){ if(confirm('刪除這張照片？')) { clockPhotos.splice(i,1); renderClockPhotos(); } };
    grid.appendChild(img);
  });
}

function compressImage(file, done){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = 1280;
      var scale = img.width > maxW ? maxW / img.width : 1;
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
      done(base64);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function initLIFF(){
  if (typeof liff === 'undefined') { document.getElementById('clockStatus').textContent = 'LIFF SDK 載入失敗'; return; }
  liff.init({ liffId: CONFIG.liffId })
    .then(function(){
      if (!liff.isLoggedIn()) { liff.login(); return; }
      return liff.getProfile().then(function(profile){
        document.getElementById('clockName').textContent = profile.displayName;
        document.getElementById('clockLine').textContent = 'LINE ID：' + profile.userId;
        buildClockSite();
      });
    })
    .catch(function(err){
      document.getElementById('clockStatus').textContent = '無法初始化 LINE：' + err + '（請確認已設定 LIFF ID）';
    });
}
initLIFF();
</script>
</body>
</html>
